services:
  - type: web
    name: motoclube-beneficios-api
    runtime: node
    rootDir: backend
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    autoDeployTrigger: commit
    envVars:
      - key: NODE_ENV
        value: production
      - key: MONGODB_URI
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: QR_HMAC_SECRET
        sync: false
      - key: FRONTEND_URL
        sync: false
      - key: PAYMENT_WEBHOOK_SECRET
        sync: false
      - key: COOKIE_SAME_SITE
        value: none
      - key: PARTNER_JWT_EXPIRES_IN
        value: 10h
      - key: QR_TTL_SECONDS
        value: "60"

  - type: web
    name: motoclube-beneficios-web
    runtime: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    autoDeployTrigger: commit
    envVars:
      - key: VITE_API_URL
        sync: false
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
